org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# App version: single source for versionCode and the X-Client-Version header (concept section 13).
ruinborn.versionCode=1
ruinborn.versionName=1.0.0
# Default server for development. Override via ~/.gradle/gradle.properties or -Pruinborn.serverUrl=...
ruinborn.serverUrl=http://localhost:8080
# AGP 9.1 is the newest version IntelliJ IDEA supports (E-25). It was not tested by Google with compileSdk 37,
# which Ktor's OkHttp requires. Build and lint pass, so the warning is suppressed.
android.suppressUnsupportedCompileSdk=37.0
