# All project versions. Only raise them deliberately (concept section 13).
# Research date: 30.09.2026 (see docs/DEVLOG.md, section 1).
[versions]
kotlin = "2.4.20"
serialization = "1.11.0"
coroutines = "1.11.0"
ktor = "3.6.0"
exposed = "1.5.0"
sqlite = "3.53.4.0"
slf4j = "2.0.20"
gdx = "1.14.2"
lwjgl3 = "3.4.3"
ktx = "1.14.2-rc2"
klogger = "0.2.0"
kotnexlib = "4.4.1"
# Android: AGP 9.1.0, the newest version IntelliJ IDEA supports (E-25). compileSdk/targetSdk 37 (see android/build.gradle.kts), minSdk 26 (concept).
agp = "9.1.0"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

klogger = { module = "bayern.kickner:Klogger", version.ref = "klogger" }
kotnexlib = { module = "bayern.kickner:KotNexLib", version.ref = "kotnexlib" }

gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
gdx-backend-headless = { module = "com.badlogicgames.gdx:gdx-backend-headless", version.ref = "gdx" }
gdx-tools = { module = "com.badlogicgames.gdx:gdx-tools", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl3" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl3" }
lwjgl-jemalloc = { module = "org.lwjgl:lwjgl-jemalloc", version.ref = "lwjgl3" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal", version.ref = "lwjgl3" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl3" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl3" }

ktx-app = { module = "io.github.quillraven.libktx:ktx-app", version.ref = "ktx" }
ktx-scene2d = { module = "io.github.quillraven.libktx:ktx-scene2d", version.ref = "ktx" }
ktx-actors = { module = "io.github.quillraven.libktx:ktx-actors", version.ref = "ktx" }
ktx-style = { module = "io.github.quillraven.libktx:ktx-style", version.ref = "ktx" }
ktx-async = { module = "io.github.quillraven.libktx:ktx-async", version.ref = "ktx" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
android-application = { id = "com.android.application", version.ref = "agp" }
